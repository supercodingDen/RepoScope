name: withdraw-v0.1.0-image-asset
on:
  push:
    paths:
      - .github/workflows/withdraw-v0.1.0-image-asset.yml
permissions:
  contents: read

jobs:
  withdraw:
    if: ${{ github.repository == 'supercodingDen/RepoScope' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Verify exact private pre-release and asset inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.1.0" >"$RUNNER_TEMP/release-before.json"
          python - "$RUNNER_TEMP/release-before.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              release = json.load(stream)
          expected = {
              "release-metadata.json": (586496465, "614e66851b2ca93d4e84249300c1b0f4dc96aa1dab147161aa36bec4ce5addf9"),
              "reposcope-nats-v0.1.0-sbom.cdx.json": (586496460, "63c647270fd772c04718d3b9a4f4b860a4b06c077ff02a8b73f8bc1f31e337b7"),
              "reposcope-postgres-v0.1.0-sbom.cdx.json": (586496457, "c290a052a1c68ec388d9e2a8a57ea16e3acfff7db0554796003286537bb24ea3"),
              "reposcope-v0.1.0-images.tar.gz": (586496458, "dcd0b716bc64083423c6e51e0704963b720215abed4ec36ac81520920b6bc453"),
              "reposcope-v0.1.0-sbom.cdx.json": (586496477, "7ec21bb5639800a2d63fcb88e881285f022949e8dd9bc9239a331717d49fbc90"),
              "SHA256SUMS": (586496462, "06f973d7341c87db455f780cb8a4a575ef185f28cd9d26653b41df45767e97f3"),
          }
          actual = {asset["name"]: (asset["id"], asset["digest"].removeprefix("sha256:")) for asset in release["assets"]}
          if release["id"] != 395930838 or not release["prerelease"] or release["draft"] or actual != expected:
              raise SystemExit("Release inventory changed; refusing withdrawal")
          print("Verified the exact six-asset private pre-release inventory.")
          PY
      - name: Withdraw image archive and obsolete checksum/metadata assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v0.1.0 --repo "$GITHUB_REPOSITORY" --json body --jq .body >"$RUNNER_TEMP/notes.md"
          cat >>"$RUNNER_TEMP/notes.md" <<'EOF'

          ### Asset withdrawal

          The Docker image archive was withdrawn before this repository became public. An independent scan found a Debian-generated `ssl-cert-snakeoil.key` private key in a PostgreSQL image layer. The original archive, its checksum list, and build metadata are no longer distributed. The three historical SBOMs remain for reference; do not treat them as deployable images. Build reviewed current images from source after configuring host-managed secrets. No RepoScope API/provider credential was involved, and no service has been deployed.
          EOF
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/586496458" >/dev/null
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/586496462" >/dev/null
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/586496465" >/dev/null
          gh release edit v0.1.0 --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md" --prerelease >/dev/null
      - name: Confirm pre-release and clean remaining assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.1.0" >"$RUNNER_TEMP/release-after.json"
          python - "$RUNNER_TEMP/release-after.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              release = json.load(stream)
          expected = {
              "reposcope-nats-v0.1.0-sbom.cdx.json",
              "reposcope-postgres-v0.1.0-sbom.cdx.json",
              "reposcope-v0.1.0-sbom.cdx.json",
          }
          names = {asset["name"] for asset in release["assets"]}
          if release["id"] != 395930838 or not release["prerelease"] or release["draft"] or names != expected:
              raise SystemExit("Unexpected release state after withdrawal")
          if "### Asset withdrawal" not in release.get("body", ""):
              raise SystemExit("Release withdrawal note is missing")
          print("Pre-release retained with three historical SBOMs and withdrawal notice.")
          PY
