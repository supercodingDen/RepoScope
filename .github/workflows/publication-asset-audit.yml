name: publication-asset-audit
on:
  push:
    paths:
      - .github/workflows/publication-asset-audit.yml
  workflow_dispatch:
permissions:
  contents: read

jobs:
  remaining-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify retained v0.1.0 pre-release inventory and bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.1.0" >"$RUNNER_TEMP/release.json"
          python - "$RUNNER_TEMP/release.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              release = json.load(stream)
          expected = {
              "reposcope-nats-v0.1.0-sbom.cdx.json": (586496460, "63c647270fd772c04718d3b9a4f4b860a4b06c077ff02a8b73f8bc1f31e337b7"),
              "reposcope-postgres-v0.1.0-sbom.cdx.json": (586496457, "c290a052a1c68ec388d9e2a8a57ea16e3acfff7db0554796003286537bb24ea3"),
              "reposcope-v0.1.0-sbom.cdx.json": (586496477, "7ec21bb5639800a2d63fcb88e881285f022949e8dd9bc9239a331717d49fbc90"),
          }
          actual = {asset["name"]: (asset["id"], asset["digest"].removeprefix("sha256:")) for asset in release["assets"]}
          if release["id"] != 395930838 or not release["prerelease"] or release["draft"] or actual != expected:
              raise SystemExit("Retained release asset inventory changed")
          if "### Asset withdrawal" not in release.get("body", ""):
              raise SystemExit("Asset withdrawal notice missing")
          print("Three historical SBOM assets and withdrawal notice verified.")
          PY
          mkdir -p "$RUNNER_TEMP/release-assets"
          gh release download v0.1.0 --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release-assets" >/dev/null
          cd "$RUNNER_TEMP/release-assets"
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 3
          printf '%s\n' \
            '63c647270fd772c04718d3b9a4f4b860a4b06c077ff02a8b73f8bc1f31e337b7  reposcope-nats-v0.1.0-sbom.cdx.json' \
            'c290a052a1c68ec388d9e2a8a57ea16e3acfff7db0554796003286537bb24ea3  reposcope-postgres-v0.1.0-sbom.cdx.json' \
            '7ec21bb5639800a2d63fcb88e881285f022949e8dd9bc9239a331717d49fbc90  reposcope-v0.1.0-sbom.cdx.json' \
            | sha256sum --check --status
          echo 'Retained release asset bytes match their GitHub digests.'
      - name: Redacted secret scan of retained assets
        run: |
          set -euo pipefail
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep '  gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum --check
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          if ./gitleaks dir --redact --no-banner "$RUNNER_TEMP/release-assets" \
            >"$RUNNER_TEMP/gitleaks-assets.log" 2>&1; then
            echo 'Retained release assets: no recognized secrets.'
          else
            echo 'Retained release asset scan failed or found a potential secret.' >&2
            exit 1
          fi
