[project]
name = "reposcope"
version = "0.1.0"
description = "Event-driven code intelligence with bounded agent execution"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.53.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "psycopg[binary,pool]==3.3.5",
  "pgvector==0.5.0",
  "nats-py==2.16.0",
  "redis==7.4.1",
  "httpx==0.28.1",
  "openai==3.14.1",
  "tiktoken==0.14.0",
  "tree-sitter==0.26.0",
  "tree-sitter-python==0.25.0",
  "tree-sitter-typescript==0.23.2",
  "prometheus-client==0.26.0",
]

[dependency-groups]
dev = [
  "ruff==0.16.8",
  "mypy==1.20.2",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "jsonschema==4.26.0",
  "types-jsonschema==4.26.0.20260518",
  "openapi-spec-validator==0.9.0",
  "PyYAML==6.0.3",
  "types-PyYAML==6.0.12.20260906",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "contracts", "scripts", "tests"]
mypy_path = "src"
warn_unused_ignores = true
disallow_any_explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
asyncio_mode = "strict"

markers = ["integration: requires real Compose dependencies and explicit opt-in"]
